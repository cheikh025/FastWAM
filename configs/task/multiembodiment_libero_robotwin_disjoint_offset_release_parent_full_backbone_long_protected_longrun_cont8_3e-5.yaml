# @package _global_
#
# exp0017 cont8: continuing the extension pattern. cont7's completion (cumulative
# step ~60,740) resolved the question raised by cont6's flat reading: full-50-task
# RoboTwin Clean mean moved 42.8% -> 46.0% (+3.2), confirming growth has decelerated
# from the initial +9.6/+9.6 pace but has NOT plateaued. 43/50 tasks nonzero (up
# from 39/50); 9/10 bimanual tasks nonzero, only lift_pot remains stuck at 0%.
# LIBERO remains fully stable -- 97.5% overall (Spatial 98.0%, Object 100.0%,
# Goal 96.0%, Long 96.0%), matching the strongest reading of the entire candidate.
#
# Per the growth-rate trend (9.6, 9.6, 0.4, 3.2 across the last four checks),
# flagged to watch closely: if the next 1-2 checks average out below ~+2/check,
# that becomes real evidence of a genuine capacity/data-mixture ceiling under
# this recipe, worth a dedicated investigation pass rather than continuing to
# extend blindly. This extension is that next data point.
#
# max_steps=60000 (this phase's own schedule) resumed via directory (full-state)
# resume from cont7's own step_050000 (global_step=50000) -- the scheduler
# rebuilds for the new, larger max_steps and fast-forwards to global_step=50000
# (83% through the new schedule), reopening the LR to continue exploring rather
# than staying decayed near-zero from cont7's own now-completed schedule.
#
# Everything else unchanged (data mixing, full backbone, LR, batch_size).

defaults:
  - override /data: multiembodiment_libero_robotwin_long_protected
  - override /model: fastwam_multiembodiment
  - _self_

batch_size: 3
num_workers: 4
gradient_accumulation_steps: 4

model:
  mot_checkpoint_mixed_attn: true

lr_scheduler_type: "cosine"
learning_rate: 3e-5
num_epochs: 1
max_steps: 60000
log_every: 10
save_every: 500
eval_every: 999999
save_full_state: true

weight_decay: 1e-2
resume: ./runs/multiembodiment_libero_robotwin_disjoint_offset_release_parent_full_backbone_long_protected_longrun_cont7_3e-5/2026-08-30_04-05-46/checkpoints/state/step_050000
