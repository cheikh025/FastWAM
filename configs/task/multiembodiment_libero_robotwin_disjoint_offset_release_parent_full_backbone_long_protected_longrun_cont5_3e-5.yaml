# @package _global_
#
# exp0017 cont5: extending training further given the decisive, still-accelerating
# positive trend confirmed at cont4's completion (cumulative step ~30,740):
# full-50-task RoboTwin Clean mean 32.8% (up from 23.2% at the previous check,
# +9.6 points over ~11,000 more steps -- no sign of slowing down), 36/50 tasks
# with nonzero success (up from 23/50), and -- the key finding, tracked across
# every check in this candidate's history -- 8 of the 10 bimanual/handover tasks
# that showed zero success under every frozen-backbone experiment in this
# project's history now work (up from 3/10 at the prior check). Only
# place_dual_shoes and handover_block remain at 0%. LIBERO fully stable
# throughout (Spatial 94%, Long 96%, both comfortably above the 90% floor).
# No basis to stop -- full-backbone + Long-protected mixing continues to do
# exactly what it was hypothesized to do, and the rate of improvement is not
# yet showing diminishing returns.
#
# max_steps=30000 (this phase's own schedule) resumed via directory (full-state)
# resume from cont4's own step_020000 (global_step=20000) -- the scheduler
# rebuilds for the new, larger max_steps and fast-forwards to global_step=20000
# (67% through the new schedule), reopening the LR to continue exploring rather
# than staying decayed near-zero from cont4's own now-completed schedule.
#
# Everything else unchanged (data mixing, full backbone, LR, batch_size).

defaults:
  - override /data: multiembodiment_libero_robotwin_long_protected
  - override /model: fastwam_multiembodiment
  - _self_

batch_size: 3
num_workers: 4
gradient_accumulation_steps: 4

model:
  mot_checkpoint_mixed_attn: true

lr_scheduler_type: "cosine"
learning_rate: 3e-5
num_epochs: 1
max_steps: 30000
log_every: 10
save_every: 500
eval_every: 999999
save_full_state: true

weight_decay: 1e-2
resume: ./runs/multiembodiment_libero_robotwin_disjoint_offset_release_parent_full_backbone_long_protected_longrun_cont4_3e-5/2026-08-27_13-28-52/checkpoints/state/step_020000
