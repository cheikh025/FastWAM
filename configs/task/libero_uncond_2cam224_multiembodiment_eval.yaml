# @package _global_
#
# Evaluation-only task config for scoring a shared-padded-multi-embodiment
# checkpoint on LIBERO. Uses the same padded, embodiment-conditioned LIBERO
# data/processor config as training (configs/data/libero_2cam_multiembodiment.yaml)
# and the matching model config (configs/model/fastwam_multiembodiment.yaml) — a
# plain `libero_uncond_2cam224_1e-4` eval would build a 7-dim model and crash loading
# a wider-K checkpoint. Current shared dims: action K=21, state K=22 (LIBERO at
# offset 0, RoboTwin at offset 7/8 — see PROGRESS_0003); exp0001/exp0002 used K=14
# with both embodiments left-aligned at offset 0.
#
# Not a training config (batch_size/scheduler fields below are placeholders required
# by shared Hydra schema, unused by experiments/libero/run_libero_manager.py).

defaults:
  - override /data: libero_2cam_multiembodiment
  - override /model: fastwam_multiembodiment
  - _self_

batch_size: 1
num_workers: 4

lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 1
max_steps: null
log_every: 10
save_every: 999999
eval_every: 999999

gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null
