# @package _global_
#
# exp0002 (PROGRESS_0002_frozen_backbone_warmup): diagnoses/addresses exp0001's
# LIBERO regression (96.67% -> 73.33% on the same 10-task/3-trial sentinel) alongside
# zero RoboTwin success. Leading hypothesis (see PROGRESS_0001 "investigate" section):
# the video-denoising loss is NOT per-embodiment-masked (unlike the action loss), so
# RoboTwin's very different visual domain trains the SAME shared video backbone that
# LIBERO's video generation depends on -- compounded by exp0001's full fine-tune with
# no freezing. This candidate freezes the entire shared MoT backbone (video + action
# DiT blocks) and trains ONLY the newly-expanded action_encoder/head/proprio_encoder
# for a warm-up phase, matching Qwen-VLA's staged training and the forgetting-
# resistance literature's finding that backbone updates (not action-head changes)
# drive most forgetting.
#
# Identical to configs/task/multiembodiment_libero_robotwin_3e-5.yaml (data/model
# wiring, batch/LR/schedule, save_full_state, eval disabled) except
# `trainable_modules: expanded_projections_only` -- isolating this one variable for a
# clean comparison against exp0001.

defaults:
  - override /data: multiembodiment_libero_robotwin
  - override /model: fastwam_multiembodiment
  - _self_

batch_size: 1
num_workers: 4
gradient_accumulation_steps: 4

model:
  mot_checkpoint_mixed_attn: true

trainable_modules: expanded_projections_only

lr_scheduler_type: "cosine"
learning_rate: 3e-5
num_epochs: 1
max_steps: 1000
log_every: 10
save_every: 100
eval_every: 999999
save_full_state: false

weight_decay: 1e-2
resume: null
