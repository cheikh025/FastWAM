# @package _global_
#
# exp0017 cont9: continuing the extension pattern. cont8's completion (cumulative
# step ~70,740) gave the fastest single-check gain since the initial +9.6/+9.6
# pace: full-50-task RoboTwin Clean mean 46.0% -> 52.0% (+6.0), first time crossing
# the 50% mark. 45/50 tasks nonzero (up from 43/50); the zero-task count has fallen
# every single check so far (27->14->9->11->7->5). Individual bimanual tasks bounce
# around at n=5 (place_dual_shoes/handover_block dipped back to 0% this check after
# showing success earlier) but the aggregate trend is unambiguously positive.
# LIBERO hit its strongest reading of the entire candidate: all 4 suites exactly
# 98.0%, overall 98.0%.
#
# Growth-rate trend across the last four checks: +9.6, +0.4, +3.2, +6.0 -- noisy
# but net positive, no evidence of a genuine ceiling. No basis to change strategy.
#
# max_steps=70000 (this phase's own schedule) resumed via directory (full-state)
# resume from cont8's own step_060000 (global_step=60000) -- the scheduler
# rebuilds for the new, larger max_steps and fast-forwards to global_step=60000
# (86% through the new schedule), reopening the LR to continue exploring rather
# than staying decayed near-zero from cont8's own now-completed schedule.
#
# Everything else unchanged (data mixing, full backbone, LR, batch_size).

defaults:
  - override /data: multiembodiment_libero_robotwin_long_protected
  - override /model: fastwam_multiembodiment
  - _self_

batch_size: 3
num_workers: 4
gradient_accumulation_steps: 4

model:
  mot_checkpoint_mixed_attn: true

lr_scheduler_type: "cosine"
learning_rate: 3e-5
num_epochs: 1
max_steps: 70000
log_every: 10
save_every: 500
eval_every: 999999
save_full_state: true

weight_decay: 1e-2
resume: ./runs/multiembodiment_libero_robotwin_disjoint_offset_release_parent_full_backbone_long_protected_longrun_cont8_3e-5/2026-08-31_04-07-08/checkpoints/state/step_060000
