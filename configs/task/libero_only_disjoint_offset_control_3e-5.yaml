# @package _global_
#
# exp0009 (PROGRESS_0009_libero_only_control): LIBERO-only continued-training
# control. Resumes from the exact same K=21/22 disjoint-offset expanded checkpoint
# every recent candidate has used (checkpoints/exp0019_expanded_k21_disjoint), but
# trains on LIBERO data ALONE -- RoboTwin is entirely absent from the training
# mixture, not just down-weighted.
#
# Motivation (see research/progress/PROGRESS_0008_disjoint_offset_3to1_ratio.md
# Section 9): across all 8 prior candidates, every single one trained on a
# LIBERO+RoboTwin mixture at some ratio (1:1, or exp0008's 3:1). None has isolated
# whether the LIBERO retention problem (no candidate has approached the 90% floor)
# is genuinely caused by multi-embodiment interference (projection overlap, backbone
# drift, mixing ratio -- the hypotheses tested by exp0002-0008) or is simply
# continued-training drift from the expanded/padded K=21/22 architecture, independent
# of RoboTwin ever being present. This candidate is the missing control: if LIBERO
# retention holds up (clears or approaches exp0019's inherited ~96.67%) under
# LIBERO-only continued training, that confirms RoboTwin's presence in the mixture
# is the necessary cause of the degradation seen in every multi-embodiment candidate
# so far. If it does NOT hold up even with zero RoboTwin exposure, the entire
# "multi-embodiment interference" framing needs revisiting -- the problem would be
# more fundamental (e.g. continued-training drift from the expanded checkpoint
# itself, or an LR/schedule mismatch relative to exp0019's own original training).
#
# Uses configs/data/libero_2cam_multiembodiment.yaml directly -- a plain
# single-embodiment RobotVideoDataset (not build_multi_embodiment_dataset), so no
# InterleavedEmbodimentSampler is involved; this is the simplest possible training
# setup, deliberately. Matches exp0001/exp0003/exp0008's full-trainable-backbone
# setting (trainable_modules unset, defaults to "dit") and the same LR/schedule/
# step budget as every recent candidate, so any retention difference is
# attributable only to RoboTwin's absence from the mixture, not a confounded
# change in training hyperparameters.
#
# Also the cheapest candidate in this project so far: no RoboTwin dataset loading
# (skips the ~900GB text-embedding cache entirely) and no RoboTwin evaluation
# needed -- purely a LIBERO training + LIBERO evaluation loop.

defaults:
  - override /data: libero_2cam_multiembodiment
  - override /model: fastwam_multiembodiment
  - _self_

batch_size: 1
num_workers: 4
gradient_accumulation_steps: 4

model:
  mot_checkpoint_mixed_attn: true

lr_scheduler_type: "cosine"
learning_rate: 3e-5
num_epochs: 1
max_steps: 1000
log_every: 10
save_every: 200
eval_every: 999999
save_full_state: false

weight_decay: 1e-2
resume: null
