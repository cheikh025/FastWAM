# @package _global_
#
# exp0015 (PROGRESS_0015): tests whether a RoboTwin-heavier sampling ratio broadens
# capability beyond exp0014's ~10-task ceiling, now that LIBERO retention risk is
# essentially zero under the frozen-backbone regime (100% throughout exp0014, unlike
# the old full-backbone lineage where a higher RoboTwin ratio was previously found
# risky for LIBERO -- exp0008's 3:1 LIBERO-heavy test on that lineage).
#
# Resumes from exp0014's cumulative-4600 checkpoint (the current project best:
# LIBERO-Spatial 100%, curated-panel RoboTwin strong, but full-50-task mean flat at
# ~12% across 2000 additional 1:1-ratio frozen-backbone steps -- see PROGRESS_0014
# Section 14 for the decisive before/after evidence).
#
# Two changes from exp0014's config:
#   1. data: multiembodiment_libero_robotwin_robotwin_heavy (RoboTwin ratio 1.0 -> 3.0,
#      LIBERO stays 1.0 -- a 1:3 LIBERO:RoboTwin mix instead of ~1:1).
#   2. Everything else (trainable_modules: expanded_projections_only, LR 3e-5, batch
#      size, disjoint K=21/22 offsets) unchanged from exp0014.

defaults:
  - override /data: multiembodiment_libero_robotwin_robotwin_heavy
  - override /model: fastwam_multiembodiment
  - _self_

batch_size: 2
num_workers: 4
gradient_accumulation_steps: 4

model:
  mot_checkpoint_mixed_attn: true

trainable_modules: expanded_projections_only

lr_scheduler_type: "cosine"
learning_rate: 3e-5
num_epochs: 1
max_steps: 1000
log_every: 10
save_every: 200
eval_every: 999999
save_full_state: false

weight_decay: 1e-2
resume: null
