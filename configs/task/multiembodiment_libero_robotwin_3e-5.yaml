# @package _global_
#
# First multi-embodiment candidate (PROGRESS_0001_padded_multiembodiment_baseline):
# resumes from an *expanded* exp0019 checkpoint (see
# research/tools/expand_checkpoint_for_multiembodiment.py) and continues training on
# an interleaved LIBERO(4 suites)+RoboTwin mixture via the shared padded K=14 action
# interface. `resume=<path>` is passed at launch time (not baked in here), matching
# the established convention for continuation runs off a promoted checkpoint.

defaults:
  - override /data: multiembodiment_libero_robotwin
  - override /model: fastwam_multiembodiment
  - _self_

# dataloading — batch_size=1 per GPU is the setup-validated OOM-safe floor for this
# model's DeepSpeed ZeRO-1 optimizer step on an 80GB A100 (see research/RUNBOOK.md
# "Training smoke"); gradient_accumulation_steps raises the effective batch size.
batch_size: 1
num_workers: 4
gradient_accumulation_steps: 4

model:
  mot_checkpoint_mixed_attn: true

# scheduler — a conservative continuation LR (matching the parent lineage's own
# continuation-fine-tuning convention, e.g. exp0019's 3e-5) rather than a
# from-scratch-training LR (1e-4), since this resumes an already-converged,
# promoted checkpoint and a large LR risks larger, harder-to-recover forgetting.
lr_scheduler_type: "cosine"
learning_rate: 3e-5
num_epochs: 1 # unused: max_steps below takes precedence in Wan22Trainer._estimate_total_train_steps
max_steps: 1000 # small, conservative initial budget for the first mixed-embodiment run — not a promise to consume the whole budget; see $run-fastwam-training for progress-check-driven continuation/extension.
log_every: 10
save_every: 100
# eval_every: disabled (very large) for this candidate. Trainer.evaluate()'s in-loop
# qualitative PSNR/SSIM sanity check assumes val_dataset is a plain RobotVideoDataset
# (`self.val_dataset.lerobot_dataset.processor`) -- ours is a ConcatDataset (data.val
# is null, so val_dataset falls back to the composite train_dataset), which crashed
# training entirely at the first eval_every boundary with zero checkpoint saved (see
# research/NOTES.md "In-loop eval crash"). Real RoboTwin/LIBERO evaluation happens via
# $evaluate-fastwam-multiembodiment's dedicated managers, not this in-loop check, so
# disabling it costs only a qualitative sanity glance, not real evaluation evidence.
# Making Trainer.evaluate() multi-embodiment-aware is a candidate for later, separate
# work (likely needs embodiment-aware sample selection, not just the one broken line).
eval_every: 999999

# save_full_state=false: skip the full DeepSpeed ZeRO state save (optimizer shards),
# which is substantially larger than the weights-only checkpoint. Disk headroom on
# this candidate is dominated by RoboTwin's 921k-unique-instruction text-embedding
# cache (~900GB, see research/RUNBOOK.md) with little room left for repeated
# full-state saves. Weights-only resume is well-tested (setup's reload/resume smoke
# test) and sufficient for this exploratory candidate; exact optimizer-state
# continuation is not required here.
save_full_state: false

# training
weight_decay: 1e-2
resume: null
