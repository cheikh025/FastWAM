# @package _global_
#
# Evaluation-only task config for scoring a shared-padded-multi-embodiment
# checkpoint on RoboTwin. Uses the padded, embodiment-conditioned RoboTwin
# data/processor config as training (configs/data/robotwin_multiembodiment.yaml) and
# the matching model config (configs/model/fastwam_multiembodiment.yaml). Current
# shared dims: action K=21, state K=22, RoboTwin's 14 natural channels at offset 7/8
# (see PROGRESS_0003); exp0001/exp0002 used K=14 with RoboTwin filling the whole
# range from offset 0 (which is the diagnosed cause of those candidates' LIBERO
# regression — RoboTwin's forward values overlapped LIBERO's valid columns).
#
# Not a training config (batch_size/scheduler fields below are placeholders required
# by shared Hydra schema, unused by experiments/robotwin/run_robotwin_manager.py).

defaults:
  - override /data: robotwin_multiembodiment
  - override /model: fastwam_multiembodiment
  - _self_

batch_size: 1
num_workers: 4

lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 1
max_steps: null
log_every: 10
save_every: 999999
eval_every: 999999

gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null
