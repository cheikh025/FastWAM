# @package _global_

defaults:
  - override /data: libero_2cam_plus90_reweighted_weaktasks_v2
  - override /model: fastwam
  - _self_

# dataloading
batch_size: 4
num_workers: 8

model:
  mot_checkpoint_mixed_attn: false

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 3e-5
num_epochs: 1
max_steps: 4000
log_every: 10
save_every: 500
eval_every: 200

# training
gradient_accumulation_steps: 4
weight_decay: 1e-2
resume: null
