# @package _global_
#
# exp0017 cont6: extending training further given the decisive, still-accelerating
# positive trend confirmed at cont5's completion (cumulative step ~40,740):
# full-50-task RoboTwin Clean mean 42.4% (up from 32.8% at the previous check,
# +9.6 points over ~10,000 more steps -- the same-magnitude jump as the prior
# check, i.e. accelerating rather than slowing), 41/50 tasks with nonzero
# success (up from 36/50), and -- the key finding, tracked across every check
# in this candidate's history -- 9 of the 10 bimanual/handover tasks now work
# (up from 8/10; handover_block finally broke through this check). Only
# place_dual_shoes has never shown any success anywhere in this project's
# history. LIBERO fully stable and, for the first time, confirmed across all
# 4 canonical suites at this checkpoint: Spatial 96.0%, Object 100.0%,
# Goal 96.0%, Long 98.0%, overall 97.5% -- the strongest LIBERO reading of
# the entire candidate, and stronger than exp0014's own pre-this-candidate
# baseline on Object/Goal. No basis to stop -- full-backbone + Long-protected
# mixing continues to do exactly what it was hypothesized to do, with no sign
# of diminishing returns yet.
#
# max_steps=40000 (this phase's own schedule) resumed via directory (full-state)
# resume from cont5's own step_030000 (global_step=30000) -- the scheduler
# rebuilds for the new, larger max_steps and fast-forwards to global_step=30000
# (75% through the new schedule), reopening the LR to continue exploring rather
# than staying decayed near-zero from cont5's own now-completed schedule.
#
# Everything else unchanged (data mixing, full backbone, LR, batch_size).

defaults:
  - override /data: multiembodiment_libero_robotwin_long_protected
  - override /model: fastwam_multiembodiment
  - _self_

batch_size: 3
num_workers: 4
gradient_accumulation_steps: 4

model:
  mot_checkpoint_mixed_attn: true

lr_scheduler_type: "cosine"
learning_rate: 3e-5
num_epochs: 1
max_steps: 40000
log_every: 10
save_every: 500
eval_every: 999999
save_full_state: true

weight_decay: 1e-2
resume: ./runs/multiembodiment_libero_robotwin_disjoint_offset_release_parent_full_backbone_long_protected_longrun_cont5_3e-5/2026-08-28_11-11-15/checkpoints/state/step_030000
