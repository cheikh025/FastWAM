train:
  _target_: fastwam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
  dataset_dirs:
    - ./data/libero_mujoco3.3.2/libero_spatial_no_noops_lerobot
    - ./data/libero_mujoco3.3.2/libero_object_no_noops_lerobot
    - ./data/libero_mujoco3.3.2/libero_goal_no_noops_lerobot
    - ./data/libero_mujoco3.3.2/libero_10_no_noops_lerobot
    # NOTE: LIBERO-90 intentionally excluded — no downloadable lerobot-format LIBERO-90
    # training data exists in the public yuanty/LIBERO-fastwam dataset (see
    # research/RUNBOOK.md "known gap"). This candidate replays only the 4 available
    # suites; LIBERO-90 retention is monitored via evaluation only, not replay.
  shape_meta:
    images:
      - key: image
        raw_shape: [3, 512, 512]
        shape: [3, 224, 224]
      - key: wrist_image
        raw_shape: [3, 512, 512]
        shape: [3, 224, 224]
    action:
      - key: default
        raw_shape: 7 # natural LIBERO action dim before padding
        shape: 7
    state:
      - key: default
        raw_shape: 8 # natural LIBERO proprio dim before padding
        shape: 8
  num_frames: 33
  global_sample_stride: 1
  action_video_freq_ratio: 4 # 32 action, 9 video frames
  video_size: [224, 448] # unchanged from the single-embodiment LIBERO config —
  # forcing a common video resolution across embodiments would distort the pretrained
  # visual pathway's known-good input distribution; batch-level interleaving
  # (InterleavedEmbodimentSampler) is used instead so each embodiment keeps its own
  # native camera/resolution setup.
  camera_key: null
  val_set_proportion: 0.0
  is_training_set: true
  skip_padding_as_possible: false
  concat_multi_camera: "horizontal"
  processor:
    _target_: fastwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    num_output_cameras: 2
    action_output_dim: 21 # shared padded K = 7 (LIBERO) + 14 (RoboTwin), not LIBERO's natural 7
    proprio_output_dim: 22 # shared padded K = 8 (LIBERO) + 14 (RoboTwin), not LIBERO's natural 8
    delta_action_dim_mask:
      default: [true, true, true, true, true, true, false] # eef poses are delta, gripper is not

    action_state_transforms: null
    use_stepwise_action_norm: False
    norm_default_mode: min/max
    norm_exception_mode: null

    # LIBERO keeps offset=0 (columns [0:7] action / [0:8] state) -- identical to its
    # position in the single-embodiment/exp0001/exp0002 checkpoints, so the inherited
    # exp0019 weights need no repositioning, only widening (see
    # research/tools/expand_checkpoint_for_multiembodiment.py and PROGRESS_0003).
    action_state_merger:
      _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
      action_target_dim: 21
      state_target_dim: 22
      action_offset: 0
      state_offset: 0

    # Qwen-VLA-style textual embodiment conditioning (arXiv 2605.30280) — the paper's
    # sole embodiment-conditioning mechanism, prepended to the instruction via
    # FastWAMProcessor.augment_instruction(). LIBERO's embodiment is the Franka Panda
    # single-arm manipulator (standard across the LIBERO benchmark).
    embodiment_description: "The robot is a Franka Panda single-arm manipulator with a parallel-jaw gripper."

    train_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [224, 224]
    val_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [224, 224]
  text_embedding_cache_dir: ./data/text_embeds_cache/libero
  context_len: 128
