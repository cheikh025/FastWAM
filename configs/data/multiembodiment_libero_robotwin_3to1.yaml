# Combined LIBERO + RoboTwin multi-embodiment training data config.
#
# Composed as one self-contained file (rather than reusing libero_2cam_multiembodiment.yaml/
# robotwin_multiembodiment.yaml via Hydra `defaults:` composition) because Hydra's
# defaults-list substitution only swaps whole top-level keys — it can't embed two
# independent existing config files as list items under `train.embodiments` with
# correctly-resolving internal interpolations. The per-embodiment `shape_meta` is
# therefore duplicated (dataset + processor) rather than interpolated; keep both
# per-embodiment blocks below in sync with libero_2cam_multiembodiment.yaml /
# robotwin_multiembodiment.yaml if either changes.
#
# exp0008 (PROGRESS_0008): byte-for-byte copy of multiembodiment_libero_robotwin.yaml
# except LIBERO's `ratio` raised from 1.0 to 3.0 (RoboTwin stays at 1.0) -- a 3:1
# LIBERO:RoboTwin batch-level mix instead of ~1:1. Untested variable across all prior
# candidates (exp0001-0007 all used 1:1). Motivated by exp0007's finding that even a
# small total RoboTwin gradient budget (~500 steps under 1:1 interleaving over 1000
# total steps) already produces real, if modest, RoboTwin capability -- diluting
# RoboTwin's share of gradient updates (more LIBERO rehearsal per RoboTwin step) may
# protect LIBERO retention without necessarily giving up that already-achieved
# capability. See research/progress/PROGRESS_0007_exp0004_replication.md Section 9.
train:
  _target_: fastwam.datasets.lerobot.multi_embodiment.build_multi_embodiment_dataset
  embodiments:
    - name: libero
      # ~1:1 batch-level mixing per the literature review's replay-ratio recommendation
      # (arXiv 2603.03818: pretrained/converged models retain well even with modest,
      # evenly-distributed replay) — not proportional to raw dataset size, which would
      # nearly starve LIBERO (RoboTwin's ~79GB raw vs. LIBERO's ~4.7GB).
      ratio: 3.0
      dataset:
        _target_: fastwam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
        dataset_dirs:
          - ./data/libero_mujoco3.3.2/libero_spatial_no_noops_lerobot
          - ./data/libero_mujoco3.3.2/libero_object_no_noops_lerobot
          - ./data/libero_mujoco3.3.2/libero_goal_no_noops_lerobot
          - ./data/libero_mujoco3.3.2/libero_10_no_noops_lerobot
          # LIBERO-90 intentionally excluded — no downloadable lerobot-format LIBERO-90
          # training data exists (see research/RUNBOOK.md "known gap"). LIBERO-90
          # retention is monitored via evaluation only, not replay, for this candidate.
        shape_meta: &libero_shape_meta
          images:
            - key: image
              raw_shape: [3, 512, 512]
              shape: [3, 224, 224]
            - key: wrist_image
              raw_shape: [3, 512, 512]
              shape: [3, 224, 224]
          action:
            - key: default
              raw_shape: 7
              shape: 7
          state:
            - key: default
              raw_shape: 8
              shape: 8
        num_frames: 33
        global_sample_stride: 1
        action_video_freq_ratio: 4
        video_size: [224, 448]
        camera_key: null
        val_set_proportion: 0.0
        is_training_set: true
        skip_padding_as_possible: false
        concat_multi_camera: "horizontal"
        processor:
          _target_: fastwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
          shape_meta: *libero_shape_meta
          num_obs_steps: 33
          num_output_cameras: 2
          action_output_dim: 21 # shared padded K = 7 (LIBERO) + 14 (RoboTwin), not LIBERO's natural 7
          proprio_output_dim: 22 # shared padded K = 8 (LIBERO) + 14 (RoboTwin), not LIBERO's natural 8
          delta_action_dim_mask:
            default: [true, true, true, true, true, true, false]
          action_state_transforms: null
          use_stepwise_action_norm: False
          norm_default_mode: min/max
          norm_exception_mode: null
          # LIBERO keeps offset=0 (columns [0:7] action / [0:8] state), identical to
          # its position in the inherited exp0019 checkpoint -- see PROGRESS_0003 for
          # why a disjoint per-embodiment offset (not left-aligned-at-0 for both) is
          # required to eliminate the exp0001/exp0002 shared-weight-column overlap
          # that caused LIBERO's collapse.
          action_state_merger:
            _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
            action_target_dim: 21
            state_target_dim: 22
            action_offset: 0
            state_offset: 0
          embodiment_description: "The robot is a Franka Panda single-arm manipulator with a parallel-jaw gripper."
          train_transforms:
            - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
            - _target_: torchvision.transforms.Resize
              size: [224, 224]
          val_transforms:
            - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
            - _target_: torchvision.transforms.Resize
              size: [224, 224]
        text_embedding_cache_dir: ./data/text_embeds_cache/libero
        context_len: 128
        # Distinct per-embodiment filename: RobotVideoDataset otherwise saves its
        # computed/loaded stats to a hardcoded "dataset_stats.json" in the shared
        # work_dir, and RoboTwin's dataset (constructed after LIBERO's) would silently
        # overwrite LIBERO's freshly-computed stats before they're ever durably saved
        # (see research/NOTES.md "Dataset-stats collision").
        stats_filename: libero_dataset_stats.json

    - name: robotwin
      ratio: 1.0
      dataset:
        _target_: fastwam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
        dataset_dirs:
          - ./data/robotwin2.0/robotwin2.0
        shape_meta: &robotwin_shape_meta
          images:
            - key: cam_high
              raw_shape: [3, 480, 640]
              shape: [3, 240, 320]
            - key: cam_left_wrist
              raw_shape: [3, 480, 640]
              shape: [3, 240, 320]
            - key: cam_right_wrist
              raw_shape: [3, 480, 640]
              shape: [3, 240, 320]
          action:
            - key: default
              raw_shape: 14
              shape: 14
          state:
            - key: default
              raw_shape: 14
              shape: 14
        num_frames: 33
        global_sample_stride: 1
        action_video_freq_ratio: 4
        video_size: [384, 320]
        camera_key: null
        val_set_proportion: 0.01
        is_training_set: true
        pretrained_norm_stats: ./data/robotwin2.0/dataset_stats.json
        skip_padding_as_possible: false
        concat_multi_camera: "robotwin"
        processor:
          _target_: fastwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
          shape_meta: *robotwin_shape_meta
          num_obs_steps: 33
          num_output_cameras: 3
          action_output_dim: 21 # shared padded K = 7 (LIBERO) + 14 (RoboTwin); RoboTwin's 14 natural channels occupy [7:21]
          proprio_output_dim: 22 # shared padded K = 8 (LIBERO) + 14 (RoboTwin); RoboTwin's 14 natural channels occupy [8:22]
          action_state_transforms: null
          use_stepwise_action_norm: False
          norm_default_mode: "z-score"
          norm_exception_mode: null
          # RoboTwin's natural channels are offset to a column range disjoint from
          # LIBERO's (action [7:21], state [8:22]) rather than both left-aligned at
          # column 0. With overlapping ranges, RoboTwin's real (non-padded) forward
          # values occupied the same shared action_encoder/head weight columns
          # LIBERO's channels depend on, so RoboTwin's gradient directly overwrote
          # them regardless of loss masking -- the diagnosed cause of exp0001/exp0002's
          # LIBERO collapse (PROGRESS_0002 Section 10, PROGRESS_0003). A disjoint
          # offset makes each column's input provably zero for the other embodiment's
          # batches, so its gradient there is exactly zero.
          action_state_merger:
            _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
            action_target_dim: 21
            state_target_dim: 22
            action_offset: 7
            state_offset: 8
          embodiment_description: "The robot is a bimanual ALOHA-AgileX manipulator with two arms, each with a parallel-jaw gripper."
          train_transforms:
            - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
            - _target_: torchvision.transforms.Resize
              size: [240, 320]
          val_transforms:
            - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
            - _target_: torchvision.transforms.Resize
              size: [240, 320]
        text_embedding_cache_dir: ./data/text_embeds_cache/robotwin
        context_len: 128
        stats_filename: robotwin_dataset_stats.json

val: null
