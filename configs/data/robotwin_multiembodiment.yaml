train:
  _target_: fastwam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
  dataset_dirs:
    - ./data/robotwin2.0/robotwin2.0
  shape_meta:
    images:
      - key: cam_high
        raw_shape: [3, 480, 640]
        shape: [3, 240, 320]
      - key: cam_left_wrist
        raw_shape: [3, 480, 640]
        shape: [3, 240, 320]
      - key: cam_right_wrist
        raw_shape: [3, 480, 640]
        shape: [3, 240, 320]
    action:
      - key: default
        raw_shape: 14
        shape: 14
    state:
      - key: default
        raw_shape: 14
        shape: 14
  num_frames: 33
  global_sample_stride: 1
  action_video_freq_ratio: 4 # 32 action, 9 video frames
  video_size: [384, 320]
  camera_key: null
  val_set_proportion: 0.01
  is_training_set: true
  pretrained_norm_stats: ./data/robotwin2.0/dataset_stats.json
  skip_padding_as_possible: false
  concat_multi_camera: "robotwin"
  processor:
    _target_: fastwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    num_output_cameras: 3
    action_output_dim: 21 # shared padded K = 7 (LIBERO) + 14 (RoboTwin); RoboTwin's 14 natural channels occupy [7:21]
    proprio_output_dim: 22 # shared padded K = 8 (LIBERO) + 14 (RoboTwin); RoboTwin's 14 natural channels occupy [8:22]

    action_state_transforms: null
    use_stepwise_action_norm: False
    norm_default_mode: "z-score"
    norm_exception_mode: null

    # RoboTwin's natural channels are offset to a column range disjoint from LIBERO's
    # (action [7:21], state [8:22]) instead of both being left-aligned at column 0.
    # With overlapping ranges, RoboTwin's real (non-padded) forward values occupied
    # the same shared action_encoder/head weight columns LIBERO's channels depend on,
    # so RoboTwin's gradient directly overwrote them regardless of loss masking --
    # this was the diagnosed cause of exp0001/exp0002's LIBERO collapse (see
    # PROGRESS_0002 Section 10 and PROGRESS_0003). A disjoint offset makes each
    # column's input provably zero for the other embodiment's batches, so its
    # gradient there is exactly zero -- interference-free without separate weights.
    action_state_merger:
      _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
      action_target_dim: 21
      state_target_dim: 22
      action_offset: 7
      state_offset: 8

    # Qwen-VLA-style textual embodiment conditioning — RoboTwin's embodiment is the
    # bimanual ALOHA-AgileX robot (confirmed during setup via
    # third_party/RoboTwin/task_config/_embodiment_config.yaml, "aloha-agilex").
    embodiment_description: "The robot is a bimanual ALOHA-AgileX manipulator with two arms, each with a parallel-jaw gripper."

    train_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [240, 320]
    val_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [240, 320]
  text_embedding_cache_dir: ./data/text_embeds_cache/robotwin
  context_len: 128
