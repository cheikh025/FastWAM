train:
  _target_: fastwam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
  dataset_dirs:
    - ./data/libero_mujoco3.3.2/libero_spatial_no_noops_lerobot
    - ./data/libero_mujoco3.3.2/libero_object_no_noops_lerobot
    # libero_goal oversampled 5x (433 -> 2165 episodes) to restore ~its original ~25% mix
    # share, given experiment 0001/0002 showed it collapsing under simple 1x concatenation
    # despite having a similar episode count to libero_spatial, which held up much better --
    # see research/NOTES.md "Investigation: exp0001 suite-selective catastrophic forgetting".
    - ./data/libero_mujoco3.3.2/libero_goal_no_noops_lerobot
    - ./data/libero_mujoco3.3.2/libero_goal_no_noops_lerobot
    - ./data/libero_mujoco3.3.2/libero_goal_no_noops_lerobot
    - ./data/libero_mujoco3.3.2/libero_goal_no_noops_lerobot
    - ./data/libero_mujoco3.3.2/libero_goal_no_noops_lerobot
    # libero_10 (Long) oversampled 5x (388 -> 1940 episodes), same rationale -- it has the
    # fewest original-suite episodes and is the only long-horizon/multi-step suite, both
    # plausible reasons it never recovered even after 8000 steps of unweighted training.
    - ./data/libero_mujoco3.3.2/libero_10_no_noops_lerobot
    - ./data/libero_mujoco3.3.2/libero_10_no_noops_lerobot
    - ./data/libero_mujoco3.3.2/libero_10_no_noops_lerobot
    - ./data/libero_mujoco3.3.2/libero_10_no_noops_lerobot
    - ./data/libero_mujoco3.3.2/libero_10_no_noops_lerobot
    - ./data/libero_mujoco3.3.2/libero_90_no_noops_lerobot
    # exp0018: broadened task-level oversampling of LIBERO-90's persistently-weakest task
    # cluster. exp0017 (4x oversampling of 7 weak tasks) showed clear gains on 3 tasks
    # (bottom-drawer, ketchup-drawer, book-under-shelf) but only mixed/marginal movement on
    # the primary "book in caddy" cluster, and let 4 new tasks emerge as weak points
    # (close-bottom-open-top-drawer, bowl-stacking, red-mug-left/right-plate). This subset
    # (654 episodes, 11 target tasks: the original 7 plus these 4) is oversampled 4x
    # (654 -> 2616 episodes, ~19% of the resulting mix) to broaden coverage of the current
    # weakest-task set. See research/NOTES.md "task-level oversampling via a filtered
    # LeRobot dataset subset" for the reusable build technique.
    - ./data/libero_mujoco3.3.2/libero_90_weak_subset_v2_lerobot
    - ./data/libero_mujoco3.3.2/libero_90_weak_subset_v2_lerobot
    - ./data/libero_mujoco3.3.2/libero_90_weak_subset_v2_lerobot
    - ./data/libero_mujoco3.3.2/libero_90_weak_subset_v2_lerobot
  shape_meta:
    images:
      - key: image
      # - key: observation.images.image
        raw_shape: [3, 512, 512]
        shape: [3, 224, 224]
      - key: wrist_image
      # - key: observation.images.wrist_image
        raw_shape: [3, 512, 512]
        shape: [3, 224, 224]
    action:
      - key: default
      # - key: action
        raw_shape: 7 # before transform
        shape: 7 # after transform
    state:
      - key: default
      # - key: observation.state
        raw_shape: 8 # before transform
        shape: 8 # after transform
  num_frames: 33
  global_sample_stride: 1
  action_video_freq_ratio: 4 # 32 action, 9 video frames
  video_size: [224, 448] # final resize video
  camera_key: null
  val_set_proportion: 0.0
  is_training_set: true
  skip_padding_as_possible: false
  concat_multi_camera: "horizontal"
  processor:
    _target_: fastwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    num_output_cameras: 2
    action_output_dim: 7 # eef_pose (6) + gripper (1)
    proprio_output_dim: 8 # eef_pose (6) + gripper (2)
    delta_action_dim_mask:
      default: [true, true, true, true, true, true, false] # eef poses are delta, gripper is not

    # action & state normalization
    action_state_transforms: null
    # action_state_transforms:
    #   - _target_: fastwam.datasets.lerobot.transforms.libero.LiberoTransform
    use_stepwise_action_norm: False
    norm_default_mode: min/max
    norm_exception_mode: null

    action_state_merger:
      _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign

    train_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [224, 224]
    val_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [224, 224]
  text_embedding_cache_dir: ./data/text_embeds_cache/libero
  context_len: 128
