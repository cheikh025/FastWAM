# Combined LIBERO + RoboTwin multi-embodiment training data config.
#
# exp0015 (PROGRESS_0015): byte-for-byte copy of the current, fixed
# multiembodiment_libero_robotwin.yaml (post-PROGRESS_0011 fixes: embodiment_description
# removed, LIBERO pretrained_norm_stats points at the release checkpoint's own paired
# stats) except RoboTwin's `ratio` raised from 1.0 to 3.0 (LIBERO stays at 1.0) -- a
# 1:3 LIBERO:RoboTwin batch-level mix instead of ~1:1, the opposite direction from
# exp0008's old 3:1 (more-LIBERO) test.
#
# Motivation (PROGRESS_0014 Section 15): under exp0014's frozen-backbone regime,
# LIBERO retention is essentially risk-free (100% throughout, since the disjoint
# action-channel offsets make each embodiment's gradient contribution to the other's
# columns provably zero, and the shared backbone cannot drift at all when frozen) --
# unlike exp0008's finding under the OLD full-backbone regime, where more RoboTwin
# exposure was risky for LIBERO. A full 50-task RoboTwin rescan showed the ~12% mean
# is flat across 2000 additional training steps under the 1:1 mixing ratio, while a
# small ~10-task set kept improving -- this tests whether giving RoboTwin a larger
# share of gradient updates broadens capability to more of the 50 tasks, now that the
# original reason for a conservative 1:1 ratio (LIBERO retention risk) no longer
# applies under frozen-backbone training.
#
# IMPORTANT: base this off the CURRENT (fixed) multiembodiment_libero_robotwin.yaml,
# not the old exp0008-era 3to1 copy (which predates the PROGRESS_0011 fixes and would
# reintroduce the embodiment_description/dataset_stats bugs if copied directly).
train:
  _target_: fastwam.datasets.lerobot.multi_embodiment.build_multi_embodiment_dataset
  embodiments:
    - name: libero
      ratio: 1.0
      dataset:
        _target_: fastwam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
        dataset_dirs:
          - ./data/libero_mujoco3.3.2/libero_spatial_no_noops_lerobot
          - ./data/libero_mujoco3.3.2/libero_object_no_noops_lerobot
          - ./data/libero_mujoco3.3.2/libero_goal_no_noops_lerobot
          - ./data/libero_mujoco3.3.2/libero_10_no_noops_lerobot
        shape_meta: &libero_shape_meta
          images:
            - key: image
              raw_shape: [3, 512, 512]
              shape: [3, 224, 224]
            - key: wrist_image
              raw_shape: [3, 512, 512]
              shape: [3, 224, 224]
          action:
            - key: default
              raw_shape: 7
              shape: 7
          state:
            - key: default
              raw_shape: 8
              shape: 8
        num_frames: 33
        global_sample_stride: 1
        action_video_freq_ratio: 4
        video_size: [224, 448]
        camera_key: null
        val_set_proportion: 0.0
        is_training_set: true
        pretrained_norm_stats: ./checkpoints/fastwam_release/libero_uncond_2cam224_dataset_stats.json
        skip_padding_as_possible: false
        concat_multi_camera: "horizontal"
        processor:
          _target_: fastwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
          shape_meta: *libero_shape_meta
          num_obs_steps: 33
          num_output_cameras: 2
          action_output_dim: 21
          proprio_output_dim: 22
          delta_action_dim_mask:
            default: [true, true, true, true, true, true, false]
          action_state_transforms: null
          use_stepwise_action_norm: False
          norm_default_mode: min/max
          norm_exception_mode: null
          action_state_merger:
            _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
            action_target_dim: 21
            state_target_dim: 22
            action_offset: 0
            state_offset: 0
          train_transforms:
            - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
            - _target_: torchvision.transforms.Resize
              size: [224, 224]
          val_transforms:
            - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
            - _target_: torchvision.transforms.Resize
              size: [224, 224]
        text_embedding_cache_dir: ./data/text_embeds_cache/libero
        context_len: 128
        stats_filename: libero_dataset_stats.json

    - name: robotwin
      ratio: 3.0
      dataset:
        _target_: fastwam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
        dataset_dirs:
          - ./data/robotwin2.0/robotwin2.0
        shape_meta: &robotwin_shape_meta
          images:
            - key: cam_high
              raw_shape: [3, 480, 640]
              shape: [3, 240, 320]
            - key: cam_left_wrist
              raw_shape: [3, 480, 640]
              shape: [3, 240, 320]
            - key: cam_right_wrist
              raw_shape: [3, 480, 640]
              shape: [3, 240, 320]
          action:
            - key: default
              raw_shape: 14
              shape: 14
          state:
            - key: default
              raw_shape: 14
              shape: 14
        num_frames: 33
        global_sample_stride: 1
        action_video_freq_ratio: 4
        video_size: [384, 320]
        camera_key: null
        val_set_proportion: 0.01
        is_training_set: true
        pretrained_norm_stats: ./data/robotwin2.0/dataset_stats.json
        skip_padding_as_possible: false
        concat_multi_camera: "robotwin"
        processor:
          _target_: fastwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
          shape_meta: *robotwin_shape_meta
          num_obs_steps: 33
          num_output_cameras: 3
          action_output_dim: 21
          proprio_output_dim: 22
          action_state_transforms: null
          use_stepwise_action_norm: False
          norm_default_mode: "z-score"
          norm_exception_mode: null
          action_state_merger:
            _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
            action_target_dim: 21
            state_target_dim: 22
            action_offset: 7
            state_offset: 8
          train_transforms:
            - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
            - _target_: torchvision.transforms.Resize
              size: [240, 320]
          val_transforms:
            - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
            - _target_: torchvision.transforms.Resize
              size: [240, 320]
        text_embedding_cache_dir: ./data/text_embeds_cache/robotwin
        context_len: 128
        stats_filename: robotwin_dataset_stats.json

val: null
