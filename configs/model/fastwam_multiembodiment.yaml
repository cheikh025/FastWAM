# Multi-embodiment variant of configs/model/fastwam.yaml.
#
# action_dim/proprio_dim are hardcoded to the shared padded K=14 rather than
# interpolated from `${data.train.processor.action_output_dim}` — `data.train` is now
# a composite multi-embodiment dataset (fastwam.datasets.lerobot.multi_embodiment.
# build_multi_embodiment_dataset), not a single RobotVideoDataset, so that
# interpolation path no longer resolves.
#
# skip_dit_load_from_pretrain=true / action_dit_pretrained_path=null: this candidate
# always resumes from an *expanded* exp0019 checkpoint (see
# research/tools/expand_checkpoint_for_multiembodiment.py), not a fresh build from the
# Wan22 backbone — the resumed weights fully overwrite the randomly-initialized
# placeholder this produces (verified during setup's training smoke test).
#
# redirect_common_files=false: the default `true` points VAE/text-encoder downloads at
# a dead HF repo (DiffSynth-Studio/Wan-Series-Converted-Safetensors, confirmed 404 —
# see research/NOTES.md). Baked in here as a fixed default rather than requiring every
# invocation to remember the CLI override.
_target_: fastwam.runtime.create_fastwam
model_id: Wan-AI/Wan2.2-TI2V-5B
tokenizer_model_id: Wan-AI/Wan2.1-T2V-1.3B
tokenizer_max_len: 128
load_text_encoder: false
proprio_dim: 14
redirect_common_files: false
mot_checkpoint_mixed_attn: true
action_dit_pretrained_path: null
skip_dit_load_from_pretrain: true

video_dit_config:
  has_image_input: false
  patch_size: [1, 2, 2]
  in_dim: 48
  hidden_dim: 3072
  ffn_dim: 14336
  freq_dim: 256
  text_dim: 4096
  out_dim: 48
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  eps: 1.0e-06
  seperated_timestep: true
  require_clip_embedding: false
  require_vae_embedding: false
  fuse_vae_embedding_in_latents: true
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}
  video_attention_mask_mode: "first_frame_causal" # default
  action_conditioned: false
  action_dim: 14
  action_group_causal_mask_mode: "group_diagonal"

action_dit_config:
  action_dim: 14
  hidden_dim: 1024
  ffn_dim: 4096
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  text_dim: 4096
  freq_dim: 256
  eps: 1.0e-06
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}

video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

loss:
  lambda_action: 1.0
